---
# Ansible collections required by the playbooks in this repository.
# Install with: ansible-galaxy collection install -r requirements.yml

collections:
  # Nautobot dynamic inventory and modules
  - name: networktocode.nautobot
    version: ">=5.3.0"

  # Shared networking connection plugins and filters
  - name: ansible.netcommon
    version: ">=6.1.0"

  # Platform-specific modules
  - name: cisco.ios
    version: ">=8.0.0"
  - name: cisco.nxos
    version: ">=6.0.0"
  - name: junipernetworks.junos
    version: ">=8.0.0"
  - name: arista.eos
    version: ">=9.0.0"

  # Utility filters used by the compliance report
  - name: community.general
    version: ">=9.0.0"
