---
# Render the intended configuration for every device from Nautobot data plus
# the corporate standards in group_vars.
#
# Nothing is pushed to a device here. The output is the answer to "what should
# this device look like", which the compliance playbook then compares against
# reality.
#
# Usage:
#   ansible-playbook playbooks/generate_intended.yml

- name: Generate intended configurations
  hosts: all
  gather_facts: false
  connection: local

  tasks:
    - name: Ensure the intended configuration directory exists
      ansible.builtin.file:
        path: "{{ intended_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Confirm a template exists for this platform
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/templates/{{ ansible_network_os }}.j2"
      register: template_stat
      delegate_to: localhost

    - name: Fail clearly when a platform has no template
      ansible.builtin.fail:
        msg: >-
          No template found for platform '{{ ansible_network_os }}'.
          Expected playbooks/templates/{{ ansible_network_os }}.j2
      when: not template_stat.stat.exists

    - name: Render the intended configuration
      ansible.builtin.template:
        src: "{{ ansible_network_os }}.j2"
        dest: "{{ intended_dir }}/{{ inventory_hostname }}.cfg"
        mode: "0644"
        lstrip_blocks: true
        trim_blocks: true
      delegate_to: localhost

    - name: Report what was rendered
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ device_platform }}):
          intended configuration written to
          intended/{{ inventory_hostname }}.cfg
