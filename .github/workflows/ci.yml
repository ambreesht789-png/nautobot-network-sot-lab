---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint YAML
        run: yamllint -c .yamllint .

      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
        working-directory: ansible

      - name: Lint Ansible
        run: ansible-lint
        working-directory: ansible

  validate:
    name: Validate seed data
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML jinja2

      - name: Validate the inventory definition
        run: python tests/validate_seed.py

      - name: Validate the Jinja2 templates
        run: python tests/validate_templates.py

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Create an environment file for validation
        run: cp .env.example .env

      - name: Validate the compose file
        run: docker compose config --quiet
